<!-- HEADER -->
<div class="header">
  <h2>Courses</h2>

  <!-- Only show "Add" button if user is Admin -->
  @if (auth.hasRole('Admin')) {
    <button mat-raised-button color="primary" (click)="openCreate()">+ Add Course</button>
  }
</div>

<!-- LOADING & ERROR STATES -->
@if (store.isLoading()) {
  <p>Loading courses...</p>
}
@if (store.error()) {
  <p class="error">{{ store.error() }}</p>
}

<!-- TABLE -->
<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
  <!-- CODE Column -->
  <ng-container matColumnDef="code">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Code</th>
    <td mat-cell *matCellDef="let row">{{ row.code }}</td>
  </ng-container>

  <!-- TITLE Column -->
  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
    <td mat-cell *matCellDef="let row">{{ row.title }}</td>
  </ng-container>

  <!-- ENROLLMENT COUNT Column -->
  <ng-container matColumnDef="enrollmentCount">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Enrolled</th>
    <td mat-cell *matCellDef="let row">{{ row.enrollmentCount }}</td>
  </ng-container>

  <!-- CAPACITY Column -->
  <ng-container matColumnDef="maxCapacity">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Capacity</th>
    <td mat-cell *matCellDef="let row">{{ row.maxCapacity }}</td>
  </ng-container>

  <!-- ACTIONS Column (FIXED) -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let row">
      <!-- Edit Button (Visible to everyone who can see the page) -->
      <button mat-button color="primary" (click)="openEdit(row)">Edit</button>

      <!-- Delete Button (ONLY visible to Admins, and now inside the loop!) -->
      @if (auth.hasRole('Admin')) {
        <button mat-button color="warn" (click)="deleteCourse(row.id)">Delete</button>
      }
    </td>
  </ng-container>

  <!-- TABLE HEADER & ROWS -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<!-- PAGINATOR (FIXED with length binding) -->
<mat-paginator
  [length]="store.totalCount()"
  [pageSizeOptions]="[10, 25, 50]"
  [pageSize]="store.pageSize()"
  showFirstLastButtons
>
</mat-paginator>
